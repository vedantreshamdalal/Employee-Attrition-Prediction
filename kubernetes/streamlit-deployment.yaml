# Local image. Load it into Minikube before applying:
# minikube image load employee-attrition-streamlit:local
# The API address uses the Kubernetes service DNS name attrition-api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attrition-streamlit
  namespace: employee-attrition
  labels:
    app: attrition-streamlit
spec:
  replicas: 1
  selector:
    match_labels:
      app: attrition-streamlit
  template:
    metadata:
      labels:
        app: attrition-streamlit
    spec:
      containers:
        - name: streamlit
          image: employee-attrition-streamlit:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
          env:
            - name: API_BASE_URL
              value: http://attrition-api:8000
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
