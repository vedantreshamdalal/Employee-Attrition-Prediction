name: CD

on:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate semantic version tag
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"
          if [[ ! "${VERSION}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag '${VERSION}' is not a semantic version."
            echo "Use vMAJOR.MINOR.PATCH, for example v1.0.0."
            exit 1
          fi
          echo "Release tag ${VERSION} is a semantic version."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate ML pipeline
        run: python -m ml.train

      - name: Run pytest
        run: pytest

  publish:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate semantic version tag
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"
          if [[ ! "${VERSION}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag '${VERSION}' is not a semantic version."
            echo "Use vMAJOR.MINOR.PATCH, for example v1.0.0."
            exit 1
          fi
          echo "Release tag ${VERSION} is a semantic version."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Train model artifacts
        run: python -m ml.train

      - name: Build API Docker image
        run: docker build -f api/Dockerfile -t employee-attrition-api:build .

      - name: Build Streamlit Docker image
        run: docker build -f streamlit_app/Dockerfile -t employee-attrition-streamlit:build .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [[ -z "${DOCKERHUB_USERNAME}" ]]; then
            echo "DOCKERHUB_USERNAME is empty. Add the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            if [[ ! "${VERSION}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Refusing to publish '${VERSION}'. Release tags must be vMAJOR.MINOR.PATCH."
              exit 1
            fi
          else
            VERSION="main-${GITHUB_SHA::7}"
          fi
          echo "Publishing ${VERSION} and latest"
          docker tag employee-attrition-api:build "${DOCKERHUB_USERNAME}/employee-attrition-api:${VERSION}"
          docker tag employee-attrition-api:build "${DOCKERHUB_USERNAME}/employee-attrition-api:latest"
          docker tag employee-attrition-streamlit:build "${DOCKERHUB_USERNAME}/employee-attrition-streamlit:${VERSION}"
          docker tag employee-attrition-streamlit:build "${DOCKERHUB_USERNAME}/employee-attrition-streamlit:latest"
          docker push "${DOCKERHUB_USERNAME}/employee-attrition-api:${VERSION}"
          docker push "${DOCKERHUB_USERNAME}/employee-attrition-api:latest"
          docker push "${DOCKERHUB_USERNAME}/employee-attrition-streamlit:${VERSION}"
          docker push "${DOCKERHUB_USERNAME}/employee-attrition-streamlit:latest"

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy only when a reachable cluster kubeconfig is configured
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [[ -z "${KUBE_CONFIG}" ]]; then
            echo "KUBE_CONFIG secret is not set. Skipping Kubernetes deployment."
            echo "GitHub-hosted runners cannot reach a local Minikube cluster."
            echo "Deploy Minikube from this machine with the commands in the README."
            exit 0
          fi
          KUBECTL="${RUNNER_TEMP}/kubectl"
          curl -sSL -o "${KUBECTL}" "https://dl.k8s.io/release/v1.31.4/bin/linux/amd64/kubectl"
          chmod +x "${KUBECTL}"
          echo "${KUBE_CONFIG}" | base64 -d > "${RUNNER_TEMP}/kubeconfig"
          export KUBECONFIG="${RUNNER_TEMP}/kubeconfig"
          "${KUBECTL}" cluster-info
          mkdir -p rendered
          for file in namespace.yaml api-deployment.yaml api-service.yaml streamlit-deployment.yaml streamlit-service.yaml; do
            sed \
              -e "s#employee-attrition-api:local#${DOCKERHUB_USERNAME}/employee-attrition-api:latest#g" \
              -e "s#employee-attrition-streamlit:local#${DOCKERHUB_USERNAME}/employee-attrition-streamlit:latest#g" \
              -e "s#imagePullPolicy: IfNotPresent#imagePullPolicy: Always#g" \
              "kubernetes/${file}" > "rendered/${file}"
          done
          "${KUBECTL}" apply -f rendered/namespace.yaml
          "${KUBECTL}" apply -f rendered/api-deployment.yaml
          "${KUBECTL}" apply -f rendered/api-service.yaml
          "${KUBECTL}" apply -f rendered/streamlit-deployment.yaml
          "${KUBECTL}" apply -f rendered/streamlit-service.yaml
          "${KUBECTL}" rollout status deployment/attrition-api -n employee-attrition --timeout=180s
          "${KUBECTL}" rollout status deployment/attrition-streamlit -n employee-attrition --timeout=180s
