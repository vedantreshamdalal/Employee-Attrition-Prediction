name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate ML pipeline
        run: python -m ml.train

      - name: Run pytest
        run: pytest

      - name: Run API tests
        run: pytest tests/test_api.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Train model artifacts for the images
        run: python -m ml.train

      - name: Build API Docker image
        run: docker build -f api/Dockerfile -t employee-attrition-api:${{ github.sha }} .

      - name: Build Streamlit Docker image
        run: docker build -f streamlit_app/Dockerfile -t employee-attrition-streamlit:${{ github.sha }} .
